name = "heyclicky-hydra-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Public, non-secret config. Override the Hydra URL once you have it.
[vars]
HYDRA_WS_URL = "wss://api.smallest.ai/hydra/v1/stream"
GEMINI_MODEL = "gemini-2.0-flash"

# Secrets — set with:
#   wrangler secret put HYDRA_API_KEY
#   wrangler secret put GEMINI_API_KEY
