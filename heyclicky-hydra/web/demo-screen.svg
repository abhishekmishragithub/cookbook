<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="system-ui, sans-serif">
  <!-- app background -->
  <rect width="1280" height="800" fill="#15181c"/>

  <!-- top bar + tabs -->
  <rect width="1280" height="64" fill="#202329"/>
  <text x="28" y="40" fill="#9aa3ad" font-size="18" font-weight="600">Resolvr — untitled_project.drp</text>
  <g font-size="15" fill="#cfd6dd">
    <rect x="430" y="20" width="84" height="32" rx="6" fill="#2a2f36"/><text x="452" y="41">Edit</text>
    <rect x="560" y="20" width="84" height="32" rx="6" fill="#1b6ef3"/><text x="582" y="41" fill="#fff">Color</text>
    <rect x="690" y="20" width="100" height="32" rx="6" fill="#2a2f36"/><text x="706" y="41">Deliver</text>
  </g>

  <!-- preview -->
  <rect x="40" y="90" width="1200" height="340" rx="8" fill="#0a0c0e" stroke="#2a2f36"/>
  <text x="600" y="270" fill="#3b424b" font-size="22">▶ preview</text>

  <!-- primary color wheels panel (bottom-left) -->
  <rect x="40" y="470" width="380" height="290" rx="8" fill="#1b1f24" stroke="#2a2f36"/>
  <text x="60" y="498" fill="#9aa3ad" font-size="14" font-weight="600">Primary — Color Wheels</text>
  <circle cx="110" cy="600" r="52" fill="#23282e" stroke="#3a414a"/>
  <circle cx="230" cy="600" r="52" fill="#23282e" stroke="#3a414a"/>
  <circle cx="350" cy="600" r="52" fill="#23282e" stroke="#3a414a"/>
  <text x="86" y="675" fill="#7b848e" font-size="12">Lift   Gamma   Gain</text>

  <!-- node editor (bottom-center/right) -->
  <rect x="650" y="470" width="430" height="250" rx="8" fill="#1b1f24" stroke="#2a2f36"/>
  <text x="670" y="498" fill="#9aa3ad" font-size="14" font-weight="600">Nodes</text>
  <rect x="720" y="540" width="90" height="60" rx="6" fill="#262b31" stroke="#3a414a"/>
  <rect x="900" y="540" width="90" height="60" rx="6" fill="#262b31" stroke="#3a414a"/>
  <line x1="810" y1="570" x2="900" y2="570" stroke="#3a414a" stroke-width="2"/>

  <!-- export button (bottom-right) -->
  <rect x="1120" y="740" width="120" height="40" rx="8" fill="#1b6ef3"/>
  <text x="1140" y="766" fill="#fff" font-size="15" font-weight="600">Export</text>
</svg>
